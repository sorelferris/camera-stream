endpoints:
  stream_pub: "tcp://0.0.0.0:5555"
  status_rep: "tcp://0.0.0.0:5556"

idle_policy:
  enabled: true
  sleep_after_s: 60

cameras:
  - name: "hand_camera"
    driver: "opencv"
    device:
      path: "/dev/v4l/by-id/usb-Intel_R__RealSense_TM__Depth_Camera_435i_Intel_R__RealSense_TM__Depth_Camera_435i_254343062015-video-index2"
    profile:
      width: 640
      height: 480
      fps: 30
    encoding:
      codec: "jpeg"
      jpeg_quality: 85

  - name: "side_camera"
    driver: "opencv"
    device:
      path: "/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Orbbec_DaBai_DCW2_RGB_Camera_CH82C5200YG-video-index0"
    profile:
      width: 640
      height: 480
      fps: 30
    encoding:
      codec: "jpeg"
      jpeg_quality: 85

  - name: "head_camera"
    driver: "opencv"
    device:
      path: "/dev/v4l/by-id/usb-SHENZHEN_AONI_ELECTRONIC_CO._LTD_aoni_webcam_A30_20191119001-video-index0"
    profile:
      width: 640
      height: 480
      fps: 30
    encoding:
      codec: "jpeg"
      jpeg_quality: 85
