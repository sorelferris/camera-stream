[project]
name = "camera-stream-client"
version = "0.1.8"
description = "Low-latency visual debugger for camera-stream ZeroMQ services"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sorel", email = "sorel.ferris@foxmail.com" }]
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pyzmq>=27.1.0",
]

[project.scripts]
camera-stream-client = "camera_stream_client.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
