[project]
name = "camera-stream"
version = "0.3.2"
description = "Low-latency multi-camera ZeroMQ streaming service and client library"
readme = "README.md"
requires-python = "==3.10.*"
authors = [{ name = "sorel", email = "sorel.ferris@foxmail.com" }]
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.2",
    "pyzmq>=27.1.0",
    "rich>=13.9.0",
]

[project.scripts]
camera-stream = "camera_stream.streamer:main"

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.58.3.10794"]
orbbec = ["pyorbbecsdk>=1.3.2"]
dev = [
    "black~=24.8",
    "pytest>=8.3",
    "ruff~=0.6",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_stream = ["templates/*.yaml"]
