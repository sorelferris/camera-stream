[project]
name = "camera-stream"
version = "0.1.0"
description = "ZMQ server to stream camera frames to clients"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "pyorbbecsdk>=1.3.2",
    "pyrealsense2>=2.58.3.10794",
    "pyzmq>=27.1.0",
]

# "opencv-python~=4.10.0",
# "pyzmq~=26.0",
# "numpy~=1.26",
# "pydantic~=2.8",

[project.optional-dependencies]
dev = [
    "black~=24.8",
    "ruff~=0.6",
]

[tool.uv]
index-url = "https://pypi.org/simple"
