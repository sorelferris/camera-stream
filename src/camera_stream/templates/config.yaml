# camera-stream starter configuration
#
# This template is valid for one V4L2/OpenCV camera. Replace /dev/video0 with
# the stable device path for your camera, then duplicate the camera block for
# additional devices. For RealSense or Orbbec, install the matching uvx extra
# and use device.serial instead of device.path.

endpoints:
  stream_pub: "tcp://0.0.0.0:5555"

# Stop capture and JPEG encoding after this camera has no stream subscribers
# for 60 seconds. Set enabled: false for continuous capture.
idle_policy:
  enabled: true
  sleep_after_s: 60

cameras:
  - name: "camera0"
    driver: "opencv"
    device:
      path: "/dev/video0"
    profile:
      width: 640
      height: 480
      fps: 30
    encoding:
      codec: "jpeg"
      jpeg_quality: 85
